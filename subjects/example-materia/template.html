<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <style>
    @page {
      size: A4;
      margin: 18mm 16mm 18mm 16mm;
    }

    :root {
      --bg: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d8dee6;
      --pill: #f6f3ef;
      --accent: #8ca6b8;
      --accent-soft: #e8eff5;
      --strong: #111827;
      --callout-bg: #f8fafc;
      --formula-bg: #fbfcfe;
      --formula-border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    body {
      font-size: 11.5pt;
      line-height: 1.45;
    }

    .page {
      min-height: calc(297mm - 36mm);
    }

    .header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 14px;
    }

    .eyebrow {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--pill);
      color: var(--muted);
      font-size: 9.5pt;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: 24pt;
      line-height: 1.08;
      letter-spacing: -0.03em;
      color: var(--accent);
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 10.5pt;
    }

    .section {
      margin: 0 0 12px;
      padding: 0 0 0 14px;
      border-left: 4px solid var(--accent-soft);
      page-break-inside: avoid;
    }

    .section h2 {
      margin: 0 0 6px;
      font-size: 14pt;
      line-height: 1.2;
      color: var(--accent);
    }

    .section p {
      margin: 0 0 6px;
    }

    .section ul,
    .section ol {
      margin: 6px 0 6px 20px;
      padding: 0;
    }

    .section li {
      margin: 0 0 4px;
    }

    .callout {
      background: var(--callout-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      margin: 8px 0 0;
    }

    .formula {
      font-family: "Consolas", "Courier New", monospace;
      font-size: 10.5pt;
      background: var(--formula-bg);
      border: 1px solid var(--formula-border);
      border-radius: 10px;
      padding: 8px 10px;
      margin: 6px 0;
      white-space: pre-wrap;
    }

    strong {
      color: var(--strong);
      font-weight: 700;
    }

    em {
      color: var(--muted);
    }

    .footer {
      margin-top: 16px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 9.5pt;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <div class="eyebrow">{{eyebrow}}</div>
      <h1>{{title}}</h1>
      <p class="subtitle">{{subtitle}}</p>
    </header>

    {{content}}

    <footer class="footer">
      <span>{{footerLeft}}</span>
      <span>{{footerRight}}</span>
    </footer>
  </main>
</body>
</html>
